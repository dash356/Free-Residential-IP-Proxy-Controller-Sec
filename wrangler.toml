name = "proxycontroller"
main = "src/index.js"
compatibility_date = "2026-06-03"

# 告诉 Cloudflare 这是一个普通的 Worker
workers_dev = true

# [安全] 必须设置强口令！WEB_PASS / PROXY_PASS 长度至少 12 位且不能是常见弱口令，
# 否则 Worker 将拒绝服务（fail closed）。
# 请在 Cloudflare 控制台 Settings -> Variables 中设置（不要提交到版本库）。
# 注意：此处故意不放 [vars] 段，以免 wrangler deploy 用空值覆盖控制台上已配好的口令。

# 声明 D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "proxy_db"
database_id = "" # 留空，一键部署向导或后续配置会引导用户绑定他们自己的 D1 数据库
